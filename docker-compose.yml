services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconai
      POSTGRES_USER: reconai
      POSTGRES_PASSWORD: reconai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconai -d reconai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      RECONAI_ENVIRONMENT: docker
      RECONAI_DATABASE_URL: postgresql://reconai:reconai@db:5432/reconai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
